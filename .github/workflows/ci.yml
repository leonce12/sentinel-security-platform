name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci  # throwaway database that only exists during the job
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel_ci@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run backend tests (migrations, auth, RBAC, ingestion, detection, scoring, incidents, deployment)
        run: pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the latest commit
      - name: Secret scan (gitleaks, full history)
        # The official gitleaks image scans every commit in the repository. (The gitleaks
        # GitHub Action scans only the pushed range, which fails on a repository's first push.)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Python static analysis (bandit, medium severity and above)
        run: pip install bandit && bandit -r backend/app -ll
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Deployment images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-service image used by Render
        run: docker build -t sentinel:ci .
      - name: Build the Docker Compose images
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          SENTINEL_SECRET_KEY: ci-only-value-that-is-at-least-32-characters-long
