# Local deployment: PostgreSQL, API and web frontend.
#   cp .env.example .env    # then set real values
#   docker compose up --build
# Open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not published to the host. Uncomment for local database tools:
    # ports: ["5432:5432"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:?Set SENTINEL_SECRET_KEY in .env}
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-production}
      SENTINEL_COOKIE_SECURE: ${SENTINEL_COOKIE_SECURE:-false}
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:8080}
      SENTINEL_VIRUSTOTAL_API_KEY: ${SENTINEL_VIRUSTOTAL_API_KEY:-}
      SENTINEL_AI_PROVIDER: ${SENTINEL_AI_PROVIDER:-none}
      SENTINEL_AI_API_KEY: ${SENTINEL_AI_API_KEY:-}
      SENTINEL_AI_BASE_URL: ${SENTINEL_AI_BASE_URL:-}
      SENTINEL_AI_MODEL: ${SENTINEL_AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose: ["8000"]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sentinel_pgdata:
