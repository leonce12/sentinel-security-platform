# Render Blueprint: one free web service running the single-service Dockerfile.
# The database is an external PostgreSQL (Neon free tier); paste its connection string
# into SENTINEL_DATABASE_URL when Render asks. Secrets are never stored in this file.
services:
  - type: web
    name: sentinel-security-platform
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness check that does not touch the database, so Render's frequent health checks do
    # not keep the Neon compute awake and use up its free monthly compute hours.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SENTINEL_ENVIRONMENT
        value: production
      - key: SENTINEL_SECRET_KEY
        generateValue: true          # random value generated by Render, never visible in Git
      - key: SENTINEL_DATABASE_URL
        sync: false                  # you paste the Neon connection string in the Render dashboard
      - key: SENTINEL_COOKIE_SECURE
        value: "true"
      - key: SENTINEL_CORS_ORIGINS
        value: https://sentinel-security-platform.onrender.com
      - key: SENTINEL_PUBLIC_DEMO
        value: "true"                # "Explore the live demo" signs visitors in as a read-only Viewer
      - key: SENTINEL_LOAD_DEMO_ON_EMPTY
        value: "true"                # load the synthetic dataset into an empty database
      - key: SENTINEL_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: SENTINEL_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SENTINEL_BOOTSTRAP_ADMIN_PASSWORD
        sync: false                  # set it yourself; remove it after your first sign-in
